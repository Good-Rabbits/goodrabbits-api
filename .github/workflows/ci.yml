name: CI Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  lint-and-test:
    name: Code Quality & Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Lint with Ruff
        run: |
          # Check for syntax errors and style conventions
          ruff check .

      - name: Run unit and integration tests
        run: |
          # Execute pytest if tests exist, else pass gracefully
          if [ -d "tests" ]; then
            pytest
          else
            echo "No tests directory found yet. Skipping pytest step."
          fi

  docker-build:
    name: Validate Docker Build
    runs-on: ubuntu-latest
    needs: lint-and-test

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          tags: goodrabbits-api:test
          cache-from: type=gha
          cache-to: type=gha,mode=max
